name: Validate release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check wechat_tracker/resources/web/presentation.js
      - run: node --check wechat_tracker/resources/web/http.js
      - run: node --check wechat_tracker/resources/web/app.js
      - run: node --test tests/frontend/*.test.cjs
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run build --prefix frontend
      - run: git diff --exit-code -- wechat_monitor/resources/dashboard
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/sync-version.py --check
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check wechat_monitor wechat_tracker tests mac scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/check-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
  native:
    timeout-minutes: 10
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install .
      - name: Compile standalone capture App (desktop permissions tested separately)
        run: |
          mkdir -p dist
          python scripts/build-monitor-helper.py --output dist/WindowMonitorCapture.app
